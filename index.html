<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConceptClear</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #070b14; color: #f8fafc; padding: 12px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
    
    /* Header */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .brand-title { font-size: 20px; font-weight: 800; color: #38bdf8; }
    .brand-sub { font-size: 11px; color: #94a3b8; }
    .header-btns { display: flex; gap: 6px; }
    .btn-top { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid #1e293b; background: #131d31; color: #fff; }
    .btn-premium { background: #0284c7; border: none; }

    /* Admin Bar */
    #adminBar { display: none; background: #064e3b; border: 1px solid #059669; border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; justify-content: space-between; align-items: center; }
    #adminBar span { font-size: 11px; font-weight: 700; color: #a7f3d0; }
    .adm-actions { display: flex; gap: 5px; }
    .adm-btn { background: #0284c7; color: #fff; border: none; padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .adm-banner-btn { background: #0d9488; }
    .adm-logout { background: #ef4444; }

    /* Medium Toggle */
    .medium-box { display: flex; background: #0d1527; padding: 4px; border-radius: 10px; border: 1px solid #1e293b; margin-bottom: 14px; }
    .med-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-weight: 700; font-size: 13px; border-radius: 6px; cursor: pointer; }
    .med-btn.active { background: #0284c7; color: #fff; }

    /* Classes */
    .class-card { background: #0b1325; border: 1px solid #1e293b; border-radius: 14px; padding: 12px; margin-bottom: 16px; }
    .class-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
    .rgb-badge { font-size: 10px; border: 1px solid #334155; padding: 2px 6px; border-radius: 4px; color: #94a3b8; }
    .grid-classes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cls-btn { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 4px; text-align: center; cursor: pointer; }
    .cls-btn:active { background: #1e293b; border-color: #38bdf8; }
    .cls-btn .t1 { font-size: 9px; color: #94a3b8; }
    .cls-btn .num { font-size: 17px; font-weight: 800; color: #fff; margin: 1px 0; }
    .cls-btn .t2 { font-size: 10px; color: #64748b; }

    /* Views */
    .page-section { display: none; }
    .page-section.active { display: block; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-back { background: #1e293b; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    /* Lists */
    .item-row { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .item-special { border-color: #0284c7; background: #0c1c38; }
    .item-row h4 { font-size: 14px; margin-bottom: 2px; }
    .item-row p { font-size: 11px; color: #94a3b8; }

    /* PDF Card */
    .pdf-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .badge { background: #0284c7; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-bottom: 6px; display: inline-block; }
    .action-row { display: flex; gap: 8px; margin-top: 10px; }
    .act-btn { flex: 1; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; text-align: center; }
    .act-view { background: #0284c7; color: #fff; }
    .act-dl { background: #1e293b; color: #fff; text-decoration: none; display: inline-block; }
    .act-off { background: #334155; color: #94a3b8; cursor: not-allowed; }

    /* Admin Action Controls */
    .adm-controls { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e293b; }
    .adm-stop { background: #d97706; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
    .adm-del { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }

    /* Footer & Bottom Banner */
    .footer-pill { text-align: center; margin-top: 20px; margin-bottom: 14px; }
    .insta-link { display: inline-flex; align-items: center; gap: 6px; background: #0b1528; border: 1px solid #1e3a5f; color: #38bdf8; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
    
    .bottom-banner-box { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 8px; margin-bottom: 25px; border: 1px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: #0f172a; min-height: 140px; }
    .bottom-banner-box img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-bar">
    <div>
      <div class="brand-title">ConceptClear</div>
      <div class="brand-sub" id="txtSub">(कॉन्सेप्ट क्लियर)</div>
    </div>
    <div class="header-btns">
      <button class="btn-top" onclick="switchLanguage()" id="txtLang">🌐 हिंदी (Hindi)</button>
      <button class="btn-top btn-premium" onclick="clickLogin()" id="btnAuth">🔒 प्रीमियम टीचर</button>
    </div>
  </div>

  <!-- Admin Bar (सिर्फ पासवर्ड डालने पर दिखेगा) -->
  <div id="adminBar">
    <span>🛡️ एडमिन एक्टिव</span>
    <div class="adm-actions">
      <button class="adm-btn adm-banner-btn" onclick="document.getElementById('bannerUploadInput').click()">+ बैनर जोड़ें</button>
      <button class="adm-btn" onclick="addNewPdf()">+ PDF जोड़ें</button>
      <button class="adm-btn adm-logout" onclick="logout()">लॉगआउट</button>
    </div>
  </div>

  <!-- गैलरी से बैनर उठाने के लिए इनपुट -->
  <input type="file" id="bannerUploadInput" accept="image/*" style="display:none;" onchange="uploadBannerFile(event)">

  <!-- फोन से सीधे PDF चुनने के लिए इनपुट -->
  <input type="file" id="directPdfInput" accept="application/pdf" style="display:none;" onchange="uploadDirectPdf(event)">

  <!-- 1. HOME SCREEN -->
  <div id="viewHome" class="page-section active">
    <div class="medium-box">
      <button class="med-btn active" id="btnMedHi" onclick="setMed('hi')">हिंदी मीडियम</button>
      <button class="med-btn" id="btnMedEn" onclick="setMed('en')">English Medium</button>
    </div>

    <!-- Class Grid -->
    <div class="class-card">
      <div class="class-card-header">
        <span id="txtClsTitle">✨ कक्षा चुनें (All Classes 6th - 12th)</span>
        <span class="rgb-badge">RGB Edition</span>
      </div>
      <div class="grid-classes">
        <div class="cls-btn" onclick="selectClass('6')"><div class="t1">CLASS</div><div class="num">6</div><div class="t2">कक्षा 6th</div></div>
        <div class="cls-btn" onclick="selectClass('7')"><div class="t1">CLASS</div><div class="num">7</div><div class="t2">कक्षा 7th</div></div>
        <div class="cls-btn" onclick="selectClass('8')"><div class="t1">CLASS</div><div class="num">8</div><div class="t2">कक्षा 8th</div></div>
        <div class="cls-btn" onclick="selectClass('9')"><div class="t1">CLASS</div><div class="num">9</div><div class="t2">कक्षा 9th</div></div>
        <div class="cls-btn" onclick="selectClass('10')"><div class="t1">CLASS</div><div class="num">10</div><div class="t2">कक्षा 10th</div></div>
        <div class="cls-btn" onclick="selectClass('11')"><div class="t1">CLASS</div><div class="num">11</div><div class="t2">कक्षा 11th</div></div>
        <div class="cls-btn" onclick="selectClass('12')"><div class="t1">CLASS</div><div class="num">12</div><div class="t2">कक्षा 12th</div></div>
      </div>
    </div>
  </div>

  <!-- 2. SUBJECTS SCREEN -->
  <div id="viewSubjects" class="page-section">
    <div class="nav-bar">
      <button class="btn-back" onclick="goScreen('viewHome')">← Back</button>
      <button class="adm-btn" id="admSubAdd" style="display:none;" onclick="addNewPdf()">+ PDF जोड़ें</button>
    </div>
    <h3 id="txtSubHeading" style="font-size: 15px; margin-bottom: 10px;">विषय सूची</h3>
    <div id="subjectBox"></div>
  </div>

  <!-- 3. PDF SCREEN -->
  <div id="viewPdf" class="page-section">
    <div class="nav-bar">
      <button class="btn-back" onclick="goScreen('viewSubjects')">← Back</button>
      <button class="adm-btn" id="admPdfAdd" style="display:none;" onclick="addNewPdf()">+ इस सेक्शन में PDF जोड़ें</button>
    </div>
    <h3 id="txtPdfHeading" style="font-size: 15px; margin-bottom: 10px;">अध्ययन सामग्री</h3>
    <div id="pdfListBox"></div>
  </div>

  <!-- DIRECT STUDY SEARCH FOOTER -->
  <div class="footer-pill">
    <div class="insta-link" onclick="clickInsta()">
      <span>🔍 DIRECT STUDY SEARCH</span>
      <span id="txtInstaId">@shivam_sahu_42</span>
      <span id="icoInstaEdit" style="display:none;">✏️</span>
    </div>
  </div>

  <!-- BOTTOM BANNER SECTION -->
  <div class="bottom-banner-box">
    <img id="imgBanner" src="1000084603.jpg" alt="ConceptClear Banner" onerror="this.src='https://via.placeholder.com/600x320?text=ConceptClear+Banner'">
  </div>

  <script>
    var currentClass = '6';
    var currentSection = 'Important Questions';
    var currentLang = 'hi';
    var isTeacher = false;

    // Local Storage से सेव्ड बैनर लोड करना
    var savedBanner = localStorage.getItem('cc_custom_banner');
    if (savedBanner) {
      document.getElementById('imgBanner').src = savedBanner;
    }

    // Local Storage से सेव्ड PDF डेटा लोड करना
    var savedDb = localStorage.getItem('cc_study_db');
    var db = savedDb ? JSON.parse(savedDb) : {
      '6': {
        'Model Paper': [{ id: 1, title: 'Class 6 - Model Paper 2026', desc: 'Sample Papers & Solutions', url: '', stop: false }],
        'Important Questions': [{ id: 2, title: 'Class 6 - Important Questions', desc: 'Exam Special Questions', url: '', stop: false }],
        'Mathematics': [{ id: 3, title: 'Chapter 1 - Knowing Our Numbers', desc: 'Full Formulas & Notes', url: '', stop: false }]
      }
    };

    function saveToLocal() {
      try {
        localStorage.setItem('cc_study_db', JSON.stringify(db));
      } catch (e) {
        console.warn('Local storage size limit exceeded or private browsing mode.');
      }
    }

    function goScreen(id) {
      document.getElementById('viewHome').className = 'page-section';
      document.getElementById('viewSubjects').className = 'page-section';
      document.getElementById('viewPdf').className = 'page-section';
      document.getElementById(id).className = 'page-section active';
    }

    function selectClass(cls) {
      currentClass = cls;
      buildSubjects();
      goScreen('viewSubjects');
    }

    function selectSection(sec) {
      currentSection = sec;
      document.getElementById('txtPdfHeading').innerText = 'Class ' + currentClass + 'th • ' + sec;
      buildPdfList();
      goScreen('viewPdf');
    }

    function buildSubjects() {
      var isHi = currentLang === 'hi';
      document.getElementById('txtSubHeading').innerText = (isHi ? 'कक्षा ' : 'Class ') + currentClass + 'th • ' + (isHi ? 'विषय चुनें' : 'Select Subject');

      var list = [
        { name: 'Model Paper', desc: isHi ? 'सभी विषयों के मॉडल पेपर' : 'All subjects model papers', icon: '📝', special: true },
        { name: 'Important Questions', desc: isHi ? 'परीक्षा उपयोगी महत्वपूर्ण प्रश्न' : 'High scoring questions', icon: '⭐', special: true },
        { name: isHi ? 'गणित (Mathematics)' : 'Mathematics', raw: 'Mathematics', desc: isHi ? 'सभी नोट्स और हल' : 'Notes & Solutions', icon: '📐' },
        { name: isHi ? 'विज्ञान (Science)' : 'Science', raw: 'Science', desc: isHi ? 'सभी नोट्स और हल' : 'Notes & Solutions', icon: '🔬' },
        { name: isHi ? 'अंग्रेजी (English)' : 'English', raw: 'English', desc: isHi ? 'व्याकरण और पाठ' : 'Grammar & Text', icon: '🔤' },
        { name: isHi ? 'हिंदी (Hindi)' : 'Hindi', raw: 'Hindi', desc: isHi ? 'व्याकरण और पाठ' : 'Grammar & Text', icon: '📚' }
      ];

      var box = document.getElementById('subjectBox');
      box.innerHTML = '';
      for (var i = 0; i < list.length; i++) {
        var it = list[i];
        var d = document.createElement('div');
        d.className = 'item-row' + (it.special ? ' item-special' : '');
        var key = it.raw || it.name;
        d.setAttribute('onclick', "selectSection('" + key + "')");
        d.innerHTML = '<span style="font-size:20px;">' + it.icon + '</span><div><h4>' + it.name + '</h4><p>' + it.desc + '</p></div>';
        box.appendChild(d);
      }
    }

    function buildPdfList() {
      var box = document.getElementById('pdfListBox');
      box.innerHTML = '';

      if (!db[currentClass]) db[currentClass] = {};
      if (!db[currentClass][currentSection]) db[currentSection] = [];
      var items = db[currentClass][currentSection] || [];

      if (items.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8; font-size:13px;">No PDF available here yet.</div>';
        return;
      }

      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var d = document.createElement('div');
        d.className = 'pdf-box';

        var dlBtn = item.stop
          ? '<button class="act-btn act-off">⛔ Download Stopped</button>'
          : '<a class="act-btn act-dl" href="' + (item.url || '#') + '" download="' + item.title + '.pdf" onclick="handleDl(event, \'' + item.url + '\')">⬇ Download PDF</a>';

        var admBtns = isTeacher
          ? '<div class="adm-controls">' +
              '<button class="adm-stop" onclick="toggleStop(' + item.id + ')">' + (item.stop ? '🟢 Resume' : '🔴 Stop Download') + '</button>' +
              '<button class="adm-del" onclick="delPdf(' + item.id + ')">🗑️ Delete</button>' +
            '</div>'
          : '';

        d.innerHTML = '<span class="badge">' + currentSection + '</span>' +
          '<h4>' + item.title + '</h4>' +
          '<p style="font-size:12px; color:#94a3b8; margin:2px 0 8px;">' + item.desc + '</p>' +
          '<div class="action-row">' +
            '<button class="act-btn act-view" onclick="doView(\'' + item.url + '\')">👁 View & Zoom</button>' +
            dlBtn +
          '</div>' + admBtns;

        box.appendChild(d);
      }
    }

    function doView(url) {
      if (url) {
        var win = window.open();
        win.document.write('<title>PDF Viewer</title><body style="margin:0; background:#000;"><iframe src="' + url + '" frameborder="0" style="border:none; width:100vw; height:100vh;"></iframe></body>');
      } else {
        alert('PDF Viewer: जल्द लिंक किया जाएगा!');
      }
    }

    function handleDl(e, url) {
      if (!url) {
        e.preventDefault();
        alert('डाउनलोड शुरू हो रहा है...');
      }
    }

    function toggleStop(id) {
      var list = db[currentClass][currentSection];
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) {
          list[i].stop = !list[i].stop;
          break;
        }
      }
      saveToLocal();
      buildPdfList();
    }

    function delPdf(id) {
      if (confirm('क्या आप इसे हटाना चाहते हैं?')) {
        db[currentClass][currentSection] = db[currentClass][currentSection].filter(function(x) { return x.id !== id; });
        saveToLocal();
        buildPdfList();
      }
    }

    function clickLogin() {
      if (isTeacher) {
        logout();
        return;
      }
      var p = prompt('प्रीमियम टीचर पासवर्ड दर्ज करें:');
      if (p === 'shivam@2008') {
        isTeacher = true;
        updateAdminState();
        alert('लॉगिन सफल! एडमिन कंट्रोल चालू हो गया है।');
      } else if (p !== null) {
        alert('गलत पासवर्ड!');
      }
    }

    function logout() {
      isTeacher = false;
      updateAdminState();
      alert('लॉगआउट सफल!');
    }

    function updateAdminState() {
      document.getElementById('adminBar').style.display = isTeacher ? 'flex' : 'none';
      document.getElementById('icoInstaEdit').style.display = isTeacher ? 'inline' : 'none';
      document.getElementById('admSubAdd').style.display = isTeacher ? 'block' : 'none';
      document.getElementById('admPdfAdd').style.display = isTeacher ? 'block' : 'none';
      document.getElementById('btnAuth').innerText = isTeacher ? '🛡️ एडमिन मोड' : '🔒 प्रीमियम टीचर';
      if (document.getElementById('viewPdf').classList.contains('active')) buildPdfList();
    }

    function uploadBannerFile(event) {
      var file = event.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var imgData = e.target.result;
          document.getElementById('imgBanner').src = imgData;
          localStorage.setItem('cc_custom_banner', imgData);
          alert('नया बैनर सफलतापूर्वक अपलोड और सेव हो गया!');
        };
        reader.readAsDataURL(file);
      }
    }

    function clickInsta() {
      if (isTeacher) {
        var id = prompt('नया इंस्टाग्राम ID दर्ज करें:', document.getElementById('txtInstaId').innerText);
        if (id) document.getElementById('txtInstaId').innerText = id;
      } else {
        var u = document.getElementById('txtInstaId').innerText.replace('@', '');
        window.open('https://instagram.com/' + u, '_blank');
      }
    }

    // सीधे फोन के मीडिया पिकर को खोलना
    function addNewPdf() {
      document.getElementById('directPdfInput').click();
    }

    // फोन से PDF चुनने के बाद का प्रोसेस
    function uploadDirectPdf(event) {
      var file = event.target.files[0];
      if (!file) return;

      var defaultTitle = file.name.replace(/\.pdf$/i, '');
      var title = prompt('PDF का शीर्षक (Title) लिखें या ठीक रहने दें:', defaultTitle);
      if (!title) return;

      var desc = prompt('विवरण (Description):', 'Complete study notes') || 'Notes';

      var reader = new FileReader();
      reader.onload = function(e) {
        var pdfDataUrl = e.target.result;

        if (!db[currentClass]) db[currentClass] = {};
        if (!db[currentClass][currentSection]) db[currentClass][currentSection] = [];

        db[currentClass][currentSection].push({
          id: Date.now(),
          title: title,
          desc: desc,
          url: pdfDataUrl,
          stop: false
        });

        saveToLocal();
        buildPdfList();
        alert('PDF फाइल फोन से सफलतापूर्वक जोड़ दी गई!');
        document.getElementById('directPdfInput').value = ""; // रीसेट
      };
      reader.readAsDataURL(file);
    }

    function setMed(m) {
      currentLang = m;
      document.getElementById('btnMedHi').className = 'med-btn' + (m === 'hi' ? ' active' : '');
      document.getElementById('btnMedEn').className = 'med-btn' + (m === 'en' ? ' active' : '');
      var isHi = m === 'hi';
      document.getElementById('txtSub').innerText = isHi ? '(कॉन्सेप्ट क्लियर)' : '(Concept Clear)';
      document.getElementById('txtLang').innerText = isHi ? '🌐 हिंदी (Hindi)' : '🌐 English';
      document.getElementById('txtClsTitle').innerText = isHi ? '✨ कक्षा चुनें (All Classes 6th - 12th)' : '✨ Select Class (All Classes 6th - 12th)';
      if (document.getElementById('viewSubjects').classList.contains('active')) buildSubjects();
    }

    function switchLanguage() {
      setMed(currentLang === 'hi' ? 'en' : 'hi');
    }
  </script>
</body>
</html>
